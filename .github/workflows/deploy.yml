name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: memory-pfl:latest
          secrets: |
            github_token=${{ secrets.GH_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image
        run: docker save memory-pfl:latest | gzip > /tmp/memory-pfl.tar.gz

      - name: Transfer image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: /tmp/memory-pfl.tar.gz
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 1

      - name: Load and start on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            docker load < memory-pfl.tar.gz
            rm memory-pfl.tar.gz
            docker compose up -d memory-pfl

[package]
name = "backend"
version = "0.3.2"
edition = "2024"
default-run = "backend"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pgvector = { version = "0.4", features = ["sqlx"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
thiserror = "2"
rmcp = { version = "0.15", features = ["server", "macros", "transport-io"] }
schemars = { version = "1", features = ["chrono04"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["trace", "compression-full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
auth-pfl = { git = "ssh://git@github.com/nesso-pfl/auth-pfl", tag = "v0.4.1" }
self_update = { version = "0.27", features = ["rustls", "archive-tar", "compression-flate2"], default-features = false }
libc = "0.2"

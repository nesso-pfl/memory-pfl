services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: memory_pfl
      POSTGRES_USER: memory_pfl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_pfl"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
